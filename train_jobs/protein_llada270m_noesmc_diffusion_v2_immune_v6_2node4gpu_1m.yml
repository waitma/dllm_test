# Submit: volc ml_task submit --conf train_jobs/protein_llada270m_noesmc_diffusion_v2_immune_v6_2node4gpu_1m.yml
# Decoder-only ablation: same v2 167/135 decoder slots and chain EOS, no ESMC weights.
# Proposed longer budget: 1,000,000 optimizer steps (5x the fusion run), not yet submitted.
# Global batch = 2 nodes * 4 GPUs * batch 4 * accumulation 8 = 256 before overflow drops.
# Queue and non-preemptible policy follow the previous c20250601 training job.
TaskName: "protein_llada270m_noesmc_diffusion_v2_immune_v6_2node4gpu_1m"
Description: "Decoder-only diffusion v2, no ESMC encoder, immune_v6, 2 nodes x 4 GPUs, 1M steps"
Storages:
  - Type: "Vepfs"
    MountPath: "/vepfs-mlp2/c20250601/251105016"
    VepfsId: "vepfs-cnbj2c98dea54433"
    SubPath: "c20250601/251105016"
Entrypoint: |
  set -euo pipefail
  cd /vepfs-mlp2/c20250601/251105016/project/dllm_test
  source activate /vepfs-mlp2/c20250601/251105016/conda/envs/protenix_abtcr
  export PYTHONPATH=/vepfs-mlp2/c20250601/251105016/project/dllm_test
  export OMP_NUM_THREADS=8
  export NCCL_TIMEOUT_SECOND=1800
  export TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=1800
  export NCCL_DEBUG=WARN
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export HF_HUB_OFFLINE=1
  export TRANSFORMERS_OFFLINE=1
  export HF_HOME=/vepfs-mlp2/c20250601/251105016/conda/cache/huggingface
  export TMPDIR=/vepfs-mlp2/c20250601/251105016/conda/cache/tmp
  mkdir -p "${TMPDIR}"
  test -w "${TMPDIR}"

  # Fail before rendezvous if the platform allocates an unexpected topology.
  test "${MLP_WORKER_NUM}" -eq 2
  test "${MLP_WORKER_GPU}" -eq 4
  # Only tokenizer assets are used from this directory; no encoder/config is loaded.
  TOKENIZER_DIR=/vepfs-mlp2/c20250601/251105016/project/dllm_test/model_weights/esmc/ESMC-300M
  PREPARED_DATA_DIR=/vepfs-mlp2/c20250601/251105016/project/dllm_test/data/prepared/immune_v6_binding_only
  OUTPUT_DIR=/vepfs-mlp2/c20250601/251105016/project/dllm_test/output/protein_llada270m_noesmc_diffusion_v2_immune_v6_2node4gpu_1m
  test -s "${TOKENIZER_DIR}/tokenizer.json"
  test -s "${TOKENIZER_DIR}/tokenizer_config.json"
  test -d "${PREPARED_DATA_DIR}/train"
  test -d "${PREPARED_DATA_DIR}/valid"
  python scripts/data/tcr_native/assert_corpus_fresh.py \
      data/tcr_papers_v2/dataset/finalize_report.json \
      data/tcr_repertoire_junc80/dataset/build_report.json

  export WANDB_MODE=online
  export WANDB_PROJECT=bioseq-llada8b-fusion
  export WANDB_DIR="${OUTPUT_DIR}/wandb"
  export WANDB_INIT_TIMEOUT=120
  mkdir -p "${WANDB_DIR}"
  if [ -f /vepfs-mlp2/c20250601/251105016/.secrets/wandb_api_key ]; then
    export WANDB_API_KEY="$(cat /vepfs-mlp2/c20250601/251105016/.secrets/wandb_api_key)"
  fi
  if ! python -c "import socket; socket.create_connection(('api.wandb.ai', 443), 10).close()" 2>/dev/null; then
    export WANDB_MODE=offline
  fi

  # Resume only from this decoder-only run's full packs, never a fusion run.
  # The training entrypoint validates mode, encoder absence, canvas and EOS policy.
  pick_latest_full() {
    local dir="$1"
    local step
    for step in $( (ls -d "${dir}"/checkpoint-[0-9]* 2>/dev/null || true) | sed 's#.*/checkpoint-##' | sort -nr ); do
      local ckpt="${dir}/checkpoint-${step}"
      if [ -s "${ckpt}/optimizer.bin" ] && [ -s "${ckpt}/pytorch_model_fsdp.bin" ] && [ -s "${ckpt}/model.safetensors" ] && [ -s "${ckpt}/scheduler.pt" ] && [ -s "${ckpt}/fusion_config.json" ]; then
        echo "${ckpt}"
        return 0
      fi
    done
    return 1
  }
  RESUME_ARGS=()
  LATEST_CKPT="$(pick_latest_full "${OUTPUT_DIR}" || true)"
  if [ -n "${LATEST_CKPT}" ]; then
    RESUME_ARGS=(--resume_from_checkpoint "${LATEST_CKPT}")
    echo "[resume] ${LATEST_CKPT}"
  else
    echo "[scratch] no full v2 checkpoint under ${OUTPUT_DIR}"
  fi

  accelerate launch \
      --config_file scripts/accelerate_configs/fsdp_llada.yaml \
      --num_machines ${MLP_WORKER_NUM} \
      --num_processes $((MLP_WORKER_NUM * MLP_WORKER_GPU)) \
      --machine_rank ${MLP_ROLE_INDEX} \
      --main_process_ip ${MLP_WORKER_0_HOST} \
      --main_process_port ${MLP_WORKER_0_PORT} \
      examples/llada/protein_pretrain_esmc.py \
          --model_name_or_path GSAI-ML/LLaDA-8B-Base \
          --decoder_init scratch \
          --decoder_d_model 768 \
          --decoder_n_layers 8 \
          --decoder_n_heads 12 \
          --decoder_mlp_hidden 3072 \
          --decoder_weight_tying False \
          --esmc_path "${TOKENIZER_DIR}" \
          --prepared_data_dir "${PREPARED_DATA_DIR}" \
          --dataset_args oas+ots+asd_antibody+trait+tcr_native+tcr_papers+tcr_repertoire \
          --fixed_receptor_lengths True \
          --train_objective diffusion \
          --diffusion_all_chains False \
          --relation_aux none \
          --residue_cond_mode token \
          --condition_norm False \
          --decoder_grad_ckpt True \
          --max_length 1024 \
          --max_protein_length 1024 \
          --per_device_train_batch_size 4 \
          --gradient_accumulation_steps 8 \
          --per_device_eval_batch_size 4 \
          --max_steps 1000000 \
          --learning_rate 1e-4 \
          --lr_scheduler_type cosine \
          --warmup_steps 2000 \
          --max_grad_norm 1.0 \
          --logging_steps 20 \
          --save_strategy steps \
          --save_steps 1000 \
          --eval_strategy steps \
          --eval_steps 1000 \
          --save_top_k 3 \
          --save_only_model False \
          --slim_checkpoints True \
          --dataloader_num_workers 4 \
          --report_to wandb \
          --run_name protein_llada270m_noesmc_diffusion_v2_immune_v6_2node4gpu_1m \
          --output_dir "${OUTPUT_DIR}" \
          "${RESUME_ARGS[@]}"
Tags: [diffusion, variable_length_v2, immune_v6, 2node4gpu, noesmc, token_only, 1m_steps, eos, fsdp]
ImageUrl: "cr-mlp-cn-beijing.cr.volces.com/public/airgen:v1"
Framework: "Custom"
ResourceQueueName: "c20250601"
TaskRoleSpecs:
  - RoleName: "worker"
    RoleReplicas: 2
    Flavor: "ml.pni2.14xlarge"
# 55 days: scale the fusion run's 11-day cap with the 5x step budget.
# This is a runtime ceiling, not a measured training-time estimate.
ActiveDeadlineSeconds: 4752000
DelayExitTimeSeconds: 0
AccessType: "Private"
Preemptible: false
Priority: 6
RetryOptions:
  EnableRetry: true
  MaxRetryTimes: 5
  IntervalSeconds: 180
  PolicySets:
    - "Failed"
