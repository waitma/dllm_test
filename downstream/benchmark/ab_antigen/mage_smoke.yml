  \ - <<'MAGE_PY'\n\"\"\"Volc-only orchestration of the unmodified MAGE demo; no custom\
  \ model or scoring.\"\"\"\nimport csv, json, os, platform, subprocess, sys\nfrom\
  \ pathlib import Path\nfrom datetime import datetime, timezone\nimport torch, transformers,\
  \ tokenizers\nfrom downstream.benchmark.ab_antigen.official import verify_source,\
  \ digest, git\nroot = Path(os.environ[\"MAGE_PROJECT_ROOT\"])\nrun = Path(os.environ[\"\
  MAGE_DEMO_DIR\"])\nlock_path = root / \"downstream/benchmark/ab_antigen/sources.lock.json\"\
  \nlock = json.loads(lock_path.read_text())\nspec = next(s for s in lock[\"sources\"\
  ] if s[\"id\"] == \"mage\")\nverification = verify_source(spec)\ndep = json.loads((run\
  \ / \"progen_source.json\").read_text())\ndep_path = Path(dep[\"path\"])\nassert\
  \ git(dep_path, \"rev-parse\", \"HEAD\") == dep[\"commit\"]\nassert git(dep_path,\
  \ \"remote\", \"get-url\", \"origin\") == dep[\"url\"]\nassert not git(dep_path,\
  \ \"status\", \"--porcelain\", \"--untracked-files=no\")\nassert all(digest(dep_path\
  \ / name) == sha for name, sha in dep[\"files\"].items())\nassets_path = root /\
  \ \"model_weights/ab_antigen_official/MAGE_V1/acquisition.json\"\nassets = json.loads(assets_path.read_text())\n\
  for asset in assets[\"files\"].values():\n    assert digest(Path(asset[\"path\"\
  ])) == asset[\"sha256\"], asset[\"path\"]\nassert torch.cuda.is_available(), \"\
  Volc GPU required\"\noutput = run / \"generated_raw.csv\"\nassert not output.exists(),\
  \ \"Do not overwrite a previous generation\"\nentry = root / \"downstream/benchmark/baselines/ab_antigen_official/mage/generate_antibodies.py\"\
  \ncommand = [sys.executable, str(entry), \"-n\", \"1\", \"-o\", str(output)]\nreport\
  \ = {\"started_at\": datetime.now(timezone.utc).isoformat(), \"command\": command,\n\
  \          \"cwd\": str(run), \"source\": verification, \"progen\": dep,\n     \
  \     \"lock_sha256\": digest(lock_path), \"assets_manifest_sha256\": digest(assets_path),\n\
  \          \"environment\": {\"python\": platform.python_version(), \"torch\": torch.__version__,\n\
  \                          \"transformers\": transformers.__version__, \"tokenizers\"\
  : tokenizers.__version__,\n                          \"gpu\": torch.cuda.get_device_name(0)},\n\
  \          \"protocol\": \"unmodified official WT-RBD n=1 demo; not a binding benchmark\"\
  ,\n          \"runtime_difference\": \"Python 3.10 / torch 2.8; author recommends\
  \ Python 3.11 / torch 2.1\",\n          \"benchmark_scores_produced\": False, \"\
  vhh_evaluation_executed\": False,\n          \"status\": \"started\"}\nreport_path\
  \ = run / \"generation_report.json\"\nreport_path.write_text(json.dumps(report,\
  \ indent=2) + \"\\n\")\nwith (run / \"generation.log\").open(\"w\") as log:\n  \
  \  result = subprocess.run(command, cwd=run, stdout=log, stderr=subprocess.STDOUT,\
  \ timeout=1200)\nreport[\"returncode\"] = result.returncode\nreport[\"status\"]\
  \ = \"generation_succeeded\" if result.returncode == 0 else \"generation_failed\"\
  \nreport[\"finished_at\"] = datetime.now(timezone.utc).isoformat()\nreport[\"log_sha256\"\
  ] = digest(run / \"generation.log\")\nif output.exists():\n    report[\"output_sha256\"\
  ] = digest(output)\n    with output.open() as stream:\n        report[\"output_rows\"\
  ] = sum(1 for _ in csv.DictReader(stream))\nverify_source(spec)\nreport_path.write_text(json.dumps(report,\
  \ indent=2) + \"\\n\")\nprint(json.dumps(report, indent=2), flush=True)\nraise SystemExit(result.returncode)\n\
  MAGE_PY\n"
