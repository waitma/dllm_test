  export PYTHONDONTWRITEBYTECODE=1\nexport PYTHONUNBUFFERED=1\nexport CUDA_VISIBLE_DEVICES=0\n\
  export USE_TF=0\nexport TOKENIZERS_PARALLELISM=false\nexport HF_HUB_OFFLINE=1\n\
