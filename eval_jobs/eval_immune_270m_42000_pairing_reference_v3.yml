TaskName: "eval-immune-270m-42000-pairing-reference-v3"
Description: "Reference-length prompt3 pairing, fixed committed-mask sampler; pilot32 then full500, n8, iter124, cfg0."
Storages:
  - Type: "Vepfs"
    MountPath: "/vepfs-mlp2/c20250601/251105016"
    VepfsId: "vepfs-cnbj2c98dea54433"
    SubPath: "c20250601/251105016"
Entrypoint: |
  set -euo pipefail
  source /vepfs-mlp2/c20250601/251105016/miniforge3/etc/profile.d/conda.sh
  conda activate /vepfs-mlp2/c20250601/251105016/conda/envs/pllm
  export PYTHONPATH=/vepfs-mlp2/c20250601/251105016/project/dllm_test
  export PYTHONUNBUFFERED=1
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=8
  export CUDA_VISIBLE_DEVICES=0
  export USE_TF=0
  export TOKENIZERS_PARALLELISM=false
  export HF_HUB_OFFLINE=1
  export TRANSFORMERS_OFFLINE=1
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export HF_HOME=/vepfs-mlp2/c20250601/251105016/conda/cache/huggingface
  PAIR_SCORE_ENV=/vepfs-mlp2/c20250601/251105016/conda/envs/protenix_abtcr
  PAIR_CHECKPOINT=/vepfs-mlp2/c20250601/251105016/project/dllm_test/output/protein_esmc_llada270m_diffusion_immune/checkpoint-42000
  PAIR_OUT=/vepfs-mlp2/c20250601/251105016/project/dllm_test/output/downstream_generation/ab_pairing_reference_v3_20260913_270m42000
  cd /vepfs-mlp2/c20250601/251105016/project/dllm_test
  test -f "${PAIR_CHECKPOINT}/model.safetensors"
  python -c 'import torch; assert torch.cuda.is_available(), "GPU required"; print(torch.cuda.get_device_name(0))'
  python -m pytest scripts/tests/bioseq/test_pairing_generation_protocol.py scripts/tests/bioseq/test_sampling_bioseq.py -q
  mkdir -p "${PAIR_OUT}"
  for PAIR_COUNT in 32 500; do
    PAIR_PREFIX="${PAIR_OUT}/holdout${PAIR_COUNT}_prompt3_lenreference_iter124"
    PATH="${PAIR_SCORE_ENV}/bin:${PATH}" \
      LD_LIBRARY_PATH="${PAIR_SCORE_ENV}/lib:${LD_LIBRARY_PATH:-}" \
      "${PAIR_SCORE_ENV}/bin/python" -u -m downstream.grammar.light_chain_pairing \
      --csv-path /vepfs-mlp2/c20250601/251105016/project/dllm_test/data/downstream/comp_chain/test_data_oas_holdout.csv \
      --checkpoint-path "${PAIR_CHECKPOINT}" --output-csv "${PAIR_PREFIX}.csv" \
      --device cuda --heavy-batch-size 2 --num-seqs 8 --light-prompt-tokens 3 \
      --light-length-mode reference --max-iter 124 --sampling-strategy gumbel_argmax \
      --temperature 1 --seed 42 --max-samples "${PAIR_COUNT}" --skip-eval \
      2>&1 | tee "${PAIR_PREFIX}_generation.log"
    PATH="${PAIR_SCORE_ENV}/bin:${PATH}" \
      LD_LIBRARY_PATH="${PAIR_SCORE_ENV}/lib:${LD_LIBRARY_PATH:-}" \
      "${PAIR_SCORE_ENV}/bin/python" -u scripts/downstream/score_pairing_generation.py \
      --csv "${PAIR_PREFIX}_n8.csv" --metrics "${PAIR_PREFIX}_metrics.json" --num-seqs 8 \
      2>&1 | tee "${PAIR_PREFIX}_scoring.log"
  done
